[project]
name = "klopnews"
version = "0.1.0"
description = "Клоп·Новости: персональные видеовыпуски новостей с ведущим Клопом Александровичем"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "anthropic>=0.40",
  "pillow>=10.4",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["klopnews*"]

[tool.setuptools.package-data]
klopnews = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
